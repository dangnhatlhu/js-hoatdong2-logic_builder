<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Builder - Máy tính mini</title>
</head>
<body>
  <h1>Logic Builder - Kiểm tra điểm</h1>
  <p>Nhập điểm từ 0 đến 10 để xem kết quả.</p>

  <script>
    const input = prompt("Vui lòng nhập điểm của bạn (từ 0 đến 10):");

    if (input === null || input.trim() === "") {
      alert("Bạn chưa nhập điểm.");
    } else {
      const diem = Number(input);

      if (!Number.isFinite(diem) || diem < 0 || diem > 10) {
        alert("Điểm không hợp lệ. Vui lòng nhập một số từ 0 đến 10.");
      } else {
        let xepLoai;

        if (diem > 8) {
          xepLoai = "Giỏi";
        } else if (diem > 6.5) {
          xepLoai = "Khá";
        } else if (diem >= 5) {
          xepLoai = "Trung bình";
        } else {
          xepLoai = "Yếu";
        }

        if (diem >= 5) {
          alert(`Chúc mừng bạn đã đạt! Xếp loại: ${xepLoai}.`);
        } else {
          alert(`Rất tiếc, hãy cố gắng hơn! Xếp loại: ${xepLoai}.`);
        }
      }
    }
  </script>
</body>
</html>
